version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: paub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paub
      POSTGRES_PASSWORD: paub_dev_2026
      POSTGRES_DB: paub_portal
    ports:
      - '5432:5432'
    volumes:
      - paub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paub -d paub_portal']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  paub_pgdata:
